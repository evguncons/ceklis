<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hedef AVM 26. Yıl Çekilişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --hot-pink: #ff1493;
            --deep-purple: #4a0e4e;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        /* Arka Plan */
        .parallax-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: url('https://www.upload.ee/image/18934053/989f5330-a252-40e4-9de5-93c4807491a1.jfif') no-repeat center center;
            background-size: cover;
            z-index: 1;
            animation: slowPan 60s linear infinite alternate;
            filter: brightness(0.6);
        }

        @keyframes slowPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-2%, -2%); }
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Ana Yerleşim Düzeni */
        .main-container {
            position: relative;
            z-index: 30;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        /* Sol Taraf - Çekiliş Alanı */
        .draw-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vh 2vw; /* Dinamik padding */
            position: relative;
        }

        /* Sağ Taraf - Kazananlar Listesi */
        .sidebar {
            width: clamp(300px, 25vw, 450px); /* Responsive genişlik */
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(20px);
            border-left: 3px solid rgba(255, 20, 147, 0.3);
            display: flex;
            flex-direction: column;
            padding: 2vh 2vw;
            box-shadow: -15px 0 40px rgba(0,0,0,0.6);
            z-index: 40;
            transition: all 0.3s ease;
        }

        .sidebar-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2rem, 4vw, 3.5rem); /* Dinamik font */
            color: #fff;
            text-align: center;
            margin-bottom: 2vh;
            border-bottom: 4px solid var(--hot-pink);
            padding-bottom: 1vh;
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--hot-pink);
        }

        .winners-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .winner-card {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 15px;
            padding: 1.5vh 1.5vw;
            margin-bottom: 1.5vh;
            border-left: 6px solid var(--hot-pink);
            animation: slideIn 0.5s ease-out;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .winner-card:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.2);
        }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .wc-name {
            font-weight: 900;
            font-size: clamp(1rem, 1.5vw, 1.6rem);
            color: white;
            display: block;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .wc-prize {
            color: #ffd700;
            font-weight: 700;
            font-size: clamp(0.8rem, 1.2vw, 1.2rem);
            text-transform: uppercase;
            margin-top: 0.5vh;
            display: block;
            letter-spacing: 0.5px;
        }

        .wc-number {
            font-family: monospace;
            color: #ccc;
            font-size: clamp(0.8rem, 1vw, 1.1rem);
            margin-top: 0.5vh;
            display: block;
            letter-spacing: 3px;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        /* Başlıklar - Responsive Fontlar (KÜÇÜLTÜLDÜ) */
        .brand-title {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 0.05em;
            line-height: 0.9;
            color: #ffffff;
            /* Font boyutu biraz küçültüldü: Min 2.5rem, Max 7rem */
            font-size: clamp(2.5rem, 10vw, 7rem); 
            text-shadow: 3px 3px 0px var(--hot-pink), 0 0 30px rgba(255, 20, 147, 0.4);
            margin-bottom: 0.1em;
            text-align: center;
        }

        .sub-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            color: white;
            letter-spacing: 0.2em;
            /* Alt başlık boyutu küçültüldü: Min 1rem, Max 2.2rem */
            font-size: clamp(1rem, 3vw, 2.2rem);
            background: rgba(255, 20, 147, 0.8);
            padding: 0.2em 1em;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 3vh;
            text-align: center;
        }

        /* Maskot Stili */
        .side-maskot {
            position: fixed;
            left: 20px;
            top: 20px;
            width: clamp(100px, 15vw, 300px);
            z-index: 25;
            pointer-events: none;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: floatMaskot 6s ease-in-out infinite;
        }

        @keyframes floatMaskot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* 5 Haneli Digit Box Ayarları */
        .digit-container {
            display: flex;
            justify-content: center;
            gap: 1.5vw;
            margin: 4vh 0;
            perspective: 1000px;
            max-width: 100%;
        }

        .digit-box {
            width: clamp(50px, 13vw, 160px);
            height: clamp(80px, 20vw, 240px);
            background: rgba(255, 255, 255, 0.95);
            color: var(--hot-pink);
            font-size: clamp(3rem, 12vw, 10rem);
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: clamp(10px, 2vw, 25px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-bottom: clamp(6px, 1vw, 15px) solid #ccc;
            position: relative;
            overflow: hidden;
        }

        .digit-box.active {
            background: var(--hot-pink);
            color: white;
            border-bottom-color: #b00b65;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 50px var(--hot-pink);
        }

        .rolling {
            animation: rollFast 0.08s infinite linear;
            filter: blur(2px);
        }

        @keyframes rollFast {
            0% { transform: translateY(-5px); }
            50% { transform: translateY(5px); }
            100% { transform: translateY(-5px); }
        }

        /* Butonlar */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 4vh;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .btn-main {
            font-family: 'Bebas Neue', sans-serif;
            background: linear-gradient(45deg, var(--hot-pink), #d6006e);
            color: #fff;
            padding: clamp(0.8rem, 1.5vw, 1.5rem) clamp(2.5rem, 5vw, 5rem);
            font-size: clamp(1.8rem, 4vw, 3.5rem);
            border-radius: 60px;
            letter-spacing: 0.1em;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 40px rgba(255, 20, 147, 0.5);
            border: 4px solid rgba(255,255,255,0.3);
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-main:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 50px rgba(255, 20, 147, 0.7);
            border-color: #fff;
        }

        .btn-secondary {
            font-family: 'Bebas Neue', sans-serif;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: #fff;
            padding: clamp(0.5rem, 1vw, 1rem) clamp(1.5rem, 3vw, 2.5rem);
            font-size: clamp(1rem, 2vw, 1.8rem);
            border-radius: 40px;
            letter-spacing: 0.1em;
            transition: all 0.3s;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: scale(1.05);
        }

        .btn-mini {
            width: clamp(40px, 6vw, 70px);
            height: clamp(40px, 6vw, 70px);
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 2vw, 2rem);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-mini:hover {
            background: white;
            color: var(--hot-pink);
            transform: scale(1.1);
        }

        /* Modallar */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(20px);
            padding: 20px;
        }

        .modal-content {
            background: #1a1a1a;
            border: 4px solid var(--hot-pink);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 900px;
            width: 100%;
            position: relative;
            box-shadow: 0 0 100px rgba(255, 20, 147, 0.4);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
        }

        .winner-title {
            font-family: 'Bebas Neue', sans-serif;
            color: #fff;
            font-size: clamp(3rem, 10vw, 6rem);
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .winner-prize {
            background: var(--hot-pink);
            color: white;
            display: inline-block;
            padding: 15px 40px; /* Padding arttırıldı */
            border-radius: 50px;
            font-weight: 900;
            /* Ödül boyutu BÜYÜTÜLDÜ: Min 2rem, Max 4.5rem */
            font-size: clamp(2rem, 6vw, 4.5rem); 
            margin-bottom: 20px;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
            border: 4px solid white; /* Çerçeve eklendi */
        }

        .winner-name {
            font-size: clamp(1.5rem, 6vw, 4rem);
            font-weight: 900;
            color: white;
            margin: 10px 0;
            word-break: break-word;
            text-transform: uppercase;
        }

        .winner-number {
            font-family: monospace;
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: #888;
            letter-spacing: 10px;
            margin-top: 15px;
        }

        /* Katılımcı Listesi Tablosu */
        .parts-table {
            width: 100%;
            border-collapse: collapse;
            color: white;
            text-align: left;
            margin-top: 20px;
        }
        .parts-table th, .parts-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .parts-table th {
            background: rgba(255, 20, 147, 0.2);
            font-weight: bold;
        }

        /* Input Alanı */
        .custom-input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.2rem;
            border-radius: 10px;
        }

        .next-prize-badge {
            position: absolute;
            top: 20px; /* Üst kısımdan 20px aşağıda */
            left: 50%;
            transform: translateX(-50%);
            background: #ffd700;
            color: black;
            padding: 2vh 4vw;
            border-radius: 50px;
            font-weight: 900;
            font-size: clamp(2rem, 4vw, 3.5rem);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: none;
            z-index: 50;
            white-space: nowrap;
            border: 6px solid #fff;
            width: auto;
            max-width: 90%;
            text-align: center;
            text-transform: uppercase;
        }

        /* --- MEDIA QUERIES (RESPONSIVE) --- */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow-y: visible; 
            }

            .sidebar {
                width: 100%;
                height: 400px; 
                border-left: none;
                border-top: 2px solid rgba(255,255,255,0.1);
                order: 2; 
            }

            .draw-area {
                min-height: 80vh; 
                padding-top: 150px; /* Badge için daha fazla yer, başlık ile çakışmayı önler */
                padding-bottom: 60px; 
                order: 1;
            }

            .side-maskot {
                left: 10px;
                top: auto; 
                bottom: 10px;
                width: 120px;
            }
        }
    </style>
</head>

                <div class="digit-box" id="d4">?</div>
                <div class="digit-box" id="d5">?</div>
            </div>

            <div class="controls">
                <!-- Manuel Ödül Butonu -->
                <button onclick="openPrizeModal()" class="btn-mini" title="Özel Ödül Ekle">
                    <i class="fas fa-plus"></i>
                </button>
                
                <!-- Başlat Butonu -->
                <button id="drawBtn" class="btn-main">BAŞLA</button>
                
                <!-- Katılımcılar Butonu -->
                <button onclick="openPartsModal()" class="btn-secondary">
                    <i class="fas fa-users mr-2"></i> KATILIMCILAR

            </div>

            <p class="mt-4 text-gray-400 font-mono text-sm" id="stats">Veriler Yükleniyor...</p>
        </div>

        <!-- SAĞ: Kazananlar Listesi -->
        <div class="sidebar">
            <h3 class="sidebar-title">KAZANANLAR</h3>
            <div class="winners-scroll-area" id="winnersListContainer">
                <!-- Kazananlar buraya eklenecek -->
            </div>
        </div>
    </div>

    <!-- Kazanan Modalı -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 class="winner-title">TEBRİKLER!</h2>
            <div class="winner-prize" id="resPrize">ÖDÜL ADI</div>
            <div class="winner-name" id="resName">Ad Soyad</div>
            <div class="winner-number" id="resNumber">00000</div>
            
            <button onclick="closeResultModal()" class="btn-main mt-8" style="font-size: 1.5rem; padding: 15px 40px;">DEVAM ET</button>
        </div>
    </div>

    <!-- Ödül Ekleme Modalı -->
    <div id="prizeModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <h3 class="text-3xl text-white font-bold mb-6">ÖZEL ÖDÜL BELİRLE</h3>
            <p class="text-gray-400 mb-4 text-xl">Bu tur için verilecek ödülü girin:</p>
            <input type="text" id="manualPrizeInput" class="custom-input" placeholder="Örn: iPhone 15 Pro Max">
            <div class="flex gap-4 justify-center mt-6">
                <button onclick="setManualPrize()" class="btn-main" style="font-size: 1.2rem; padding: 1rem 3rem;">KAYDET</button>
                <button onclick="document.getElementById('prizeModal').style.display='none'" class="btn-mini" style="border-radius: 15px; width: auto; padding: 0 30px; font-size: 1rem;">İPTAL</button>
            </div>
        </div>
    </div>

    <!-- Katılımcılar Listesi Modalı -->
    <div id="partsModal" class="modal">
        <div class="modal-content" style="max-width: 800px; text-align: left;">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-3xl text-white font-bold">KATILIMCI LİSTESİ</h3>
                <button onclick="document.getElementById('partsModal').style.display='none'" class="text-white hover:text-pink-500 text-2xl"><i class="fas fa-times"></i></button>
            </div>
            <p class="text-gray-400 mb-2">Toplam çekiliş hakkı (bilet sayısı) baz alınarak şans oranı hesaplanır.</p>
            
            <div style="max-height: 500px; overflow-y: auto;">
                <table class="parts-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Ad Soyad</th>
                            <th>Bilet Adeti</th>
                        </tr>
                    </thead>
                    <tbody id="partsTableBody">
                        <!-- JS ile dolacak -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

        let participants = [...initialData];
        let manualNextPrize = null; 
        
        let generatedNumbers = new Set();

        // DOM Elementleri
        const digitBoxes = Array.from({length: 5}, (_, i) => document.getElementById(`d${i+1}`));
        const drawBtn = document.getElementById('drawBtn');
        const nextPrizeDisplay = document.getElementById('nextPrizeDisplay');
        const nextPrizeText = document.getElementById('nextPrizeText');
        const statsEl = document.getElementById('stats');
        const winnersContainer = document.getElementById('winnersListContainer');

        // İstatistik Güncelle
        function updateStats() {
            const totalTickets = participants.reduce((sum, p) => sum + parseInt(p.tickets || 0), 0);
            const fmtPart = participants.length.toLocaleString('tr-TR');
            const fmtTick = totalTickets.toLocaleString('tr-TR');
            statsEl.innerText = `Toplam Katılımcı: ${fmtPart} | Toplam Bilet: ${fmtTick}`;
        }
        updateStats();

        // Ödül Havuzu (SIFIRLANDI - Manuel Giriş Zorunlu)
        let defaultPrizes = [];

        // --- FONKSİYONLAR ---

        function openPrizeModal() {
            document.getElementById('prizeModal').style.display = 'flex';
            document.getElementById('manualPrizeInput').focus();
        }

        // Katılımcılar Modalını Açma
        function openPartsModal() {
            const tbody = document.getElementById('partsTableBody');
            tbody.innerHTML = "";
            participants.forEach((p, idx) => {
                const row = `<tr>
                    <td>${idx + 1}</td>
                    <td>${p.name}</td>
                    <td class="font-mono text-pink-400 font-bold">${p.tickets}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
            document.getElementById('partsModal').style.display = 'flex';
        }

        function setManualPrize() {
            const input = document.getElementById('manualPrizeInput');
            if(input.value.trim() !== "") {
                manualNextPrize = input.value.trim();
                nextPrizeText.innerText = manualNextPrize;
                nextPrizeDisplay.style.display = "block";
                document.getElementById('prizeModal').style.display = 'none';
                input.value = "";
            }
        }

        // KAZANAN BELİRLEME (Ağırlıklı Algoritma)
        function pickWinner() {
            if (participants.length === 0) return null;

            let totalWeight = participants.reduce((sum, p) => sum + parseInt(p.tickets || 0), 0);
            let random = Math.random() * totalWeight;
            
            for (let i = 0; i < participants.length; i++) {
                random -= parseInt(participants[i].tickets || 0);
                if (random <= 0) {
                    return participants[i];
                }
            }
            return participants[participants.length - 1];
        }

        // 5 Haneli Benzersiz Numara Üretici (10000 - 43652 Aralığı)
        function generateUniqueNumber() {
            const MIN = 10000;
            const MAX = 43652;
            let num;
            
            // Güvenlik: Sonsuz döngü engellemek için
            let attempts = 0;
            const maxAttempts = 100000;

            do {
                num = Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
                num = num.toString();
                attempts++;
                if (attempts > maxAttempts) {
                    console.warn("Benzersiz numara üretilemedi, aralık dolmuş olabilir.");
                    break; 
                }
            } while (generatedNumbers.has(num));
            
            generatedNumbers.add(num);
            return num;
        }

        function getPrize() {
            if (manualNextPrize) {
                const prize = manualNextPrize;
                manualNextPrize = null;
                nextPrizeDisplay.style.display = "none";
                return prize;
            } else {
                return "SÜRPRİZ HEDİYE"; // Manuel girilmezse varsayılan
            }
        }

        // ÇEKİLİŞ ANİMASYONU
        async function startDrawing() {
            if (participants.length === 0) {
                alert("Katılımcı listesi boş!");
                return;
            }
            
            // Eğer manuel ödül girilmemişse uyar
            if (!manualNextPrize) {
                alert("Lütfen önce verilecek ödülü belirleyin ('Özel Ödül Ekle' butonu ile).");
                openPrizeModal();
                return;
            }

            drawBtn.disabled = true;
            drawBtn.style.opacity = "0.5";
            drawBtn.innerText = "DÖNÜYOR...";

            const winnerData = pickWinner();
            const luckyNumber = generateUniqueNumber();
            const prize = getPrize();

            // Bekleme süresi 2.5 saniyeye düşürüldü
            const animationDuration = 2500; 
            
            const interval = setInterval(() => {
                // Ekranda 10000 - 43652 arası rastgele sayılar dönsün
                const min = 10000;
                const max = 43652;
                const tempNum = (Math.floor(Math.random() * (max - min + 1)) + min).toString();
                
                digitBoxes.forEach((box, i) => {
                    box.innerText = tempNum[i];
                    box.classList.add('rolling');
                });
            }, 50);

            setTimeout(() => {
                clearInterval(interval);
                revealWinner(winnerData, luckyNumber, prize);
            }, animationDuration);
        }

        // SONUCU GÖSTERME
        async function revealWinner(winner, luckyNumber, prize) {
            const targetNum = luckyNumber.toString(); 

            // Her rakam arasında kademeli bekleme ekleyerek heyecanı arttırıyoruz
            const delays = [300, 600, 900, 1200, 1500]; // Giderek artan bekleme süreleri

            for(let i = 0; i < 5; i++) {
                await new Promise(r => setTimeout(r, delays[i])); // Kademeli bekleme
                digitBoxes[i].classList.remove('rolling');
                digitBoxes[i].innerText = targetNum[i];
                digitBoxes[i].classList.add('active');
            }

            await new Promise(r => setTimeout(r, 500)); // Son rakamdan sonra azıcık daha bekle

            fireConfetti();

            setTimeout(() => {
                document.getElementById('resName').innerText = winner.name;
                document.getElementById('resNumber').innerText = luckyNumber;
                document.getElementById('resPrize').innerText = prize;
                document.getElementById('resultModal').style.display = 'flex';

                addWinnerToSidebar(winner, luckyNumber, prize);
                
                drawBtn.disabled = false;
                drawBtn.style.opacity = "1";
                drawBtn.innerText = "BAŞLA";
                
                digitBoxes.forEach(b => b.classList.remove('active'));
            }, 500);
        }

        function addWinnerToSidebar(winner, luckyNum, prize) {
            const card = document.createElement('div');
            card.className = 'winner-card';
            card.innerHTML = `
                <span class="wc-name">${winner.name}</span>
                <span class="wc-prize"><i class="fas fa-trophy text-yellow-400 mr-2"></i>${prize}</span>
                <span class="wc-number">#${luckyNum}</span>
            `;
            winnersContainer.prepend(card);
        }

        function closeResultModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 3000 };
            var random = function(min, max) { return Math.random() * (max - min) + min; };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti({ ...defaults, particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } });
                confetti({ ...defaults, particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 250);
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal') && event.target.id !== 'resultModal') {
                event.target.style.display = "none";
            }
        }
        
        drawBtn.addEventListener('click', startDrawing);
