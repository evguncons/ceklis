<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedef AVM 26. Yıl Çekilişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --hot-pink: #ff1493;
            --deep-purple: #4a0e4e;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        /* Arka Plan */
        .parallax-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: url('https://www.upload.ee/image/18934053/989f5330-a252-40e4-9de5-93c4807491a1.jfif') no-repeat center center;
            background-size: cover;
            z-index: 1;
            animation: slowPan 60s linear infinite alternate;
            filter: brightness(0.6);
        }

        @keyframes slowPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-2%, -2%); }
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 30;
            text-align: center;
            width: 100%;
            max-width: 1600px;
            padding: 20px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .brand-title {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 0.1em;
            line-height: 0.9;
            color: #ffffff;
            text-shadow: 4px 4px 0px var(--hot-pink), 0 0 40px rgba(255, 20, 147, 0.5);
        }

        /* 9 Haneli Digit Box Ayarları */
        .digit-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 40px 0;
            perspective: 1000px;
        }

        .digit-box {
            width: 75px;
            height: 110px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--hot-pink);
            font-size: 4.5rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-bottom: 6px solid #ccc;
            position: relative;
            overflow: hidden;
        }

        .digit-box.active {
            background: var(--hot-pink);
            color: white;
            border-bottom: 6px solid #b00b65;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 30px var(--hot-pink);
        }

        .rolling {
            animation: rollFast 0.08s infinite linear;
            filter: blur(2px);
        }

        @keyframes rollFast {
            0% { transform: translateY(-5px); }
            50% { transform: translateY(5px); }
            100% { transform: translateY(-5px); }
        }

        /* Butonlar */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-main {
            font-family: 'Bebas Neue', sans-serif;
            background: linear-gradient(45deg, var(--hot-pink), #d6006e);
            color: #fff;
            padding: 1rem 4rem;
            font-size: 2.5rem;
            border-radius: 50px;
            letter-spacing: 0.1em;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
            border: 4px solid rgba(255,255,255,0.2);
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-main:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(255, 20, 147, 0.6);
            border-color: #fff;
        }

        .btn-sub {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-sub:hover {
            background: white;
            color: var(--hot-pink);
        }

        /* Modallar */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            padding: 20px;
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid var(--hot-pink);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 800px;
            width: 100%;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 20, 147, 0.2);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .winner-title {
            font-family: 'Bebas Neue', sans-serif;
            color: var(--hot-pink);
            font-size: 4rem;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        .winner-prize {
            background: white;
            color: black;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .winner-name {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            margin: 10px 0;
        }

        .winner-number {
            font-family: monospace;
            font-size: 2rem;
            color: #888;
            letter-spacing: 10px;
            margin-top: 10px;
        }

        /* Kazananlar Listesi Tablosu */
        .winners-table {
            width: 100%;
            color: white;
            border-collapse: collapse;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            display: block;
        }
        
        .winners-table th, .winners-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .winners-table th {
            background: rgba(255,20,147,0.2);
            position: sticky;
            top: 0;
        }

        /* Input Alanı */
        .custom-input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.2rem;
            border-radius: 10px;
        }

        .next-prize-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffd700;
            color: black;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: none;
            z-index: 50;
        }

        @media (max-width: 1024px) {
            .digit-box { width: 50px; height: 80px; font-size: 3rem; }
            .brand-title { font-size: 5rem; }
        }

        @media (max-width: 768px) {
            .digit-box { width: 32px; height: 50px; font-size: 1.8rem; gap: 4px; }
            .brand-title { font-size: 3.5rem; }
            .btn-main { padding: 0.8rem 2rem; font-size: 1.5rem; }
            .controls { flex-direction: column; width: 80%; }
        }
    </style>
</head>
<body>

    <div class="parallax-bg"></div>
    <div class="overlay"></div>

    <!-- Aktif olarak seçili özel ödül varsa burada görünür -->
    <div id="nextPrizeDisplay" class="next-prize-badge">
        <i class="fas fa-gift mr-2"></i> SIRADAKİ ÖDÜL: <span id="nextPrizeText"></span>
    </div>

    <div class="content-wrapper">
        <h1 class="brand-title text-8xl md:text-9xl mb-2">HEDEF AVM</h1>
        <h2 class="text-2xl md:text-4xl font-light text-white tracking-[0.5em] mb-10">26. YIL ÇEKİLİŞİ</h2>

        <!-- 9 Haneli Çekiliş Alanı -->
        <div class="digit-container">
            <div class="digit-box" id="d1">?</div>
            <div class="digit-box" id="d2">?</div>
            <div class="digit-box" id="d3">?</div>
            <div class="digit-box" id="d4">?</div>
            <div class="digit-box" id="d5">?</div>
            <div class="digit-box" id="d6">?</div>
            <div class="digit-box" id="d7">?</div>
            <div class="digit-box" id="d8">?</div>
            <div class="digit-box" id="d9">?</div>
        </div>

        <div class="controls">
            <button onclick="openPrizeModal()" class="btn-sub">
                <i class="fas fa-plus-circle"></i> ÖDÜL BELİRLE
            </button>
            <button id="drawBtn" class="btn-main">ÇEKİLİŞİ BAŞLAT</button>
            <button onclick="openWinnersModal()" class="btn-sub">
                <i class="fas fa-list"></i> KAZANANLAR
            </button>
        </div>

        <p class="mt-8 text-gray-400 font-mono text-sm" id="stats">Kalan Katılımcı: Yükleniyor...</p>
    </div>

    <!-- Kazanan Modalı -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 class="winner-title">TEBRİKLER!</h2>
            <div class="winner-prize" id="resPrize">ÖDÜL ADI</div>
            <div class="winner-name" id="resName">Ad Soyad</div>
            <div class="winner-number" id="resNumber">000000000</div>
            
            <button onclick="closeResultModal()" class="btn-main mt-8" style="font-size: 1.5rem; padding: 10px 40px;">DEVAM ET</button>
        </div>
    </div>

    <!-- Ödül Ekleme Modalı -->
    <div id="prizeModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <h3 class="text-2xl text-white font-bold mb-4">SIRADAKİ ÖDÜLÜ BELİRLE</h3>
            <p class="text-gray-400 mb-4">Bir sonraki çekilişte verilecek ödülü girin.</p>
            <input type="text" id="manualPrizeInput" class="custom-input" placeholder="Örn: Arçelik Tost Makinesi">
            <div class="flex gap-4 justify-center">
                <button onclick="setManualPrize()" class="btn-main" style="font-size: 1.2rem;">KAYDET</button>
                <button onclick="document.getElementById('prizeModal').style.display='none'" class="btn-sub">İPTAL</button>
            </div>
        </div>
    </div>

    <!-- Kazananlar Listesi Modalı -->
    <div id="winnersModal" class="modal">
        <div class="modal-content">
            <h3 class="text-3xl text-white font-bold mb-4">KAZANANLAR LİSTESİ</h3>
            <div style="overflow-x: auto;">
                <table class="winners-table">
                    <thead>
                        <tr>
                            <th>Sıra</th>
                            <th>Ad Soyad</th>
                            <th>Bilet No</th>
                            <th>Kazanılan Ödül</th>
                        </tr>
                    </thead>
                    <tbody id="winnersTableBody">
                        <!-- JS ile doldurulacak -->
                    </tbody>
                </table>
            </div>
            <button onclick="document.getElementById('winnersModal').style.display='none'" class="btn-sub mt-6 w-full justify-center">KAPAT</button>
        </div>
    </div>

    <script>
        // --- VERİ HAZIRLIĞI ---
        // CSV'den alınan veriler
        const rawData = [
            { name: "Ahmet MELLA", tickets: 100, number: "644820875" },
            { name: "ALEYNA NUR EMİR", tickets: 326, number: "787484889" },
            { name: "Amine ŞAHİN", tickets: 100, number: "371220107" },
            { name: "Arda Hüseyin PAŞAVUL", tickets: 100, number: "642857455" },
            { name: "Arif AKPINAR", tickets: 100, number: "358200636" },
            { name: "ARZU KARAY", tickets: 275, number: "642445041" },
            { name: "Arzu ORAN", tickets: 100, number: "182338245" },
            { name: "Aşur DEMİR", tickets: 100, number: "387785606" },
            { name: "Ata CAN", tickets: 57, number: "704046157" },
            { name: "Atakan YAŞASIN", tickets: 100, number: "556730796" },
            { name: "AYCAN BOZKURT", tickets: 217, number: "137006759" },
            { name: "AYHAN GÖKKAYA", tickets: 302, number: "453044405" },
            { name: "AYNUR SAYAN", tickets: 300, number: "816263022" },
            { name: "Ayşenur AKTAŞ", tickets: 100, number: "851093798" },
            { name: "Aziz YILDIZ", tickets: 100, number: "322226589" },
            { name: "Barış EROĞLU", tickets: 100, number: "318029417" },
            { name: "Barış ÜNAL", tickets: 100, number: "179819257" },
            { name: "BELGİN ÇELİK", tickets: 294, number: "414280201" },
            { name: "Sibel SAĞLAM", tickets: 100, number: "420506747" },
            { name: "SİBEL ZORBA", tickets: 300, number: "373607171" },
            { name: "Sinan GÜNEŞ", tickets: 100, number: "565890735" },
            { name: "SİNEM DÜLGER", tickets: 133, number: "604262451" },
            { name: "Sueda SANDIKÇI", tickets: 100, number: "983030759" },
            { name: "Sümeyye GÜLDAR", tickets: 100, number: "242352382" },
            { name: "SÜMEYRA KARS", tickets: 50, number: "800374523" },
            { name: "SÜMEYYE MİNAS", tickets: 199, number: "340450945" },
            { name: "Şaziye ŞENOL", tickets: 100, number: "281406922" },
            { name: "ŞEFİK AKAR", tickets: 87, number: "563388328" },
            { name: "ŞEHRİ KILIÇLI", tickets: 304, number: "719898308" },
            { name: "Şenay SARI", tickets: 100, number: "512863501" },
            { name: "Şevval FINDIK GÜNER", tickets: 50, number: "165391440" },
            { name: "ŞEVVAL GÜNER", tickets: 31, number: "629667576" },
            { name: "ŞEVVAL ÖZBEK", tickets: 81, number: "473837404" },
            { name: "ŞEVVAL YILDIZ", tickets: 80, number: "613127257" },
            { name: "ŞEYDA AYDIN", tickets: 228, number: "322755363" }
        ];

        // Standart Ödül Havuzu (Eğer manuel giriş yapılmazsa buradan seçilir)
        let defaultPrizes = [
            "Samsung 55\" TV", "iPhone 15", "Dyson V15 Süpürge", 
            "Arçelik Çamaşır Makinesi", "Philips Airfryer", "PlayStation 5", 
            "Apple Watch Series 9", "Karaca Yemek Takımı", "Nespresso Kahve Makinesi",
            "Bosch Bulaşık Makinesi"
        ];

        // --- DEĞİŞKENLER ---
        let participants = [...rawData]; // Çalışma listesi
        let winnersList = []; // Kazananlar geçmişi
        let manualNextPrize = null; // Manuel girilen ödül

        // DOM Elementleri
        const digitBoxes = Array.from({length: 9}, (_, i) => document.getElementById(`d${i+1}`));
        const drawBtn = document.getElementById('drawBtn');
        const nextPrizeDisplay = document.getElementById('nextPrizeDisplay');
        const nextPrizeText = document.getElementById('nextPrizeText');
        const statsEl = document.getElementById('stats');

        // İstatistik Güncelle
        function updateStats() {
            const totalTickets = participants.reduce((sum, p) => sum + p.tickets, 0);
            statsEl.innerText = `Kalan Katılımcı: ${participants.length} | Toplam Çekiliş Hakkı: ${totalTickets}`;
        }
        updateStats();

        // --- FONKSİYONLAR ---

        // 1. Manuel Ödül Ayarlama
        function openPrizeModal() {
            document.getElementById('prizeModal').style.display = 'flex';
            document.getElementById('manualPrizeInput').focus();
        }

        function setManualPrize() {
            const input = document.getElementById('manualPrizeInput');
            if(input.value.trim() !== "") {
                manualNextPrize = input.value.trim();
                nextPrizeText.innerText = manualNextPrize;
                nextPrizeDisplay.style.display = "block";
                document.getElementById('prizeModal').style.display = 'none';
                input.value = "";
            }
        }

        // 2. Kazanan Belirleme (Ağırlıklı Algoritma)
        function pickWinner() {
            if (participants.length === 0) return null;

            // Toplam bilet sayısını bul
            let totalWeight = participants.reduce((sum, p) => sum + p.tickets, 0);
            
            // 0 ile Toplam arasında rastgele sayı seç
            let random = Math.random() * totalWeight;
            
            // Kazananı bul
            for (let i = 0; i < participants.length; i++) {
                random -= participants[i].tickets;
                if (random <= 0) {
                    return { winner: participants[i], index: i };
                }
            }
            return { winner: participants[participants.length - 1], index: participants.length - 1 };
        }

        // 3. Ödül Seçimi
        function getPrize() {
            if (manualNextPrize) {
                const prize = manualNextPrize;
                manualNextPrize = null;
                nextPrizeDisplay.style.display = "none";
                return prize;
            } else {
                if (defaultPrizes.length === 0) return "Sürpriz Hediye";
                // Rastgele bir ödül seç ve listeden çıkar
                const randIdx = Math.floor(Math.random() * defaultPrizes.length);
                const prize = defaultPrizes[randIdx];
                defaultPrizes.splice(randIdx, 1);
                return prize;
            }
        }

        // 4. Çekiliş Animasyonu
        async function startDrawing() {
            if (participants.length === 0) {
                alert("Çekilişe katılacak kimse kalmadı!");
                return;
            }

            drawBtn.disabled = true;
            drawBtn.style.opacity = "0.5";
            drawBtn.innerText = "ÇEKİLİYOR...";

            // Kazananı ve Ödülü Belirle (Arka planda)
            const resultData = pickWinner();
            const prize = getPrize();
            const winner = resultData.winner;
            const winnerIndex = resultData.index;

            // Katılımcıyı listeden sil (Bir daha çıkmasın)
            participants.splice(winnerIndex, 1);

            // Animasyon Döngüsü
            const animationDuration = 3500; // 3.5 saniye
            const startTime = Date.now();

            const interval = setInterval(() => {
                // Rastgele sayılar döndür
                const tempNum = Math.floor(Math.random() * 999999999).toString().padStart(9, '0');
                digitBoxes.forEach((box, i) => {
                    box.innerText = tempNum[i];
                    box.classList.add('rolling');
                });
            }, 50);

            // Süre bitince dur
            setTimeout(() => {
                clearInterval(interval);
                revealWinner(winner, prize);
            }, animationDuration);
        }

        // 5. Sonucu Ekrana Basma
        async function revealWinner(winner, prize) {
            const targetNum = winner.number; // Kazananın gerçek numarası

            // Sırayla rakamları yerine oturt
            for(let i = 0; i < 9; i++) {
                digitBoxes[i].classList.remove('rolling');
                digitBoxes[i].innerText = targetNum[i];
                digitBoxes[i].classList.add('active');
                
                // Efekt sesi eklenebilir
                await new Promise(r => setTimeout(r, 200)); 
            }

            // Konfeti patlat
            fireConfetti();

            // Modalı göster
            setTimeout(() => {
                document.getElementById('resName').innerText = winner.name;
                document.getElementById('resNumber').innerText = winner.number;
                document.getElementById('resPrize').innerText = prize;
                document.getElementById('resultModal').style.display = 'flex';

                // Kazananlar listesine ekle
                addToWinnersList(winner, prize);
                updateStats();
                
                drawBtn.disabled = false;
                drawBtn.style.opacity = "1";
                drawBtn.innerText = "ÇEKİLİŞİ BAŞLAT";
                
                // Kutu efektlerini temizle
                digitBoxes.forEach(b => b.classList.remove('active'));
            }, 500);
        }

        // 6. Kazananlar Listesi İşlemleri
        function addToWinnersList(winner, prize) {
            winnersList.push({ ...winner, prize });
            renderWinnersTable();
        }

        function renderWinnersTable() {
            const tbody = document.getElementById('winnersTableBody');
            tbody.innerHTML = "";
            winnersList.forEach((w, idx) => {
                const row = `
                    <tr>
                        <td>${idx + 1}</td>
                        <td class="font-bold">${w.name}</td>
                        <td class="font-mono text-gray-400">${w.number}</td>
                        <td class="text-pink-400">${w.prize}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function openWinnersModal() {
            document.getElementById('winnersModal').style.display = 'flex';
        }

        function closeResultModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        // --- GÖRSEL EFEKTLER ---
        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 2000 };

            var random = function(min, max) {
                return Math.random() * (max - min) + min;
            };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                confetti({ ...defaults, particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } });
                confetti({ ...defaults, particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 250);
        }

        // Dışarı tıklayınca modalları kapatma
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                // Sonuç modalı hariç diğerlerini kapat (Sonuç modalı sadece butonla kapansın heyecan sürsün)
                if (event.target.id !== 'resultModal') {
                    event.target.style.display = "none";
                }
            }
        }
        
        // --- BUTON OLAYI EKLEME (ÖNEMLİ DÜZELTME) ---
        // Butona tıklama olayı ekleniyor
        drawBtn.addEventListener('click', startDrawing);

    </script>
</body>
</html>
